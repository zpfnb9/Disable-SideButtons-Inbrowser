name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the system csc.exe
        shell: cmd
        run: build.cmd

      - name: Check outputs
        shell: cmd
        run: |
          dir dist
          if not exist dist\DisableSideGestures.exe exit /b 1

      - uses: actions/upload-artifact@v4
        with:
          name: DisableSideGestures
          path: |
            dist/DisableSideGestures.exe
            dist/XButtonHarness.exe
